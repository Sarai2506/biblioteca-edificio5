<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Biblioteca Edificio 5</title>
    <!-- Vinculación estricta al archivo de estilos unificado -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; text-align: left;">
        
        <span class="user-badge" style="background-color: #1b263b; color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px;">ESIME ZACATENCO</span>
        <h2 style="color: #1b263b; margin-bottom: 5px;">Menú Principal de Alumno</h2>
        <p id="info-usuario" style="margin-bottom: 15px; color: #555; font-size: 13px;">Cargando datos de sesión...</p>
        
        <!-- Tarjeta de estado de adeudos o sanciones -->
        <div id="card-adeudo" style="padding: 12px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #334155;">
            Verificando estatus de biblioteca...
        </div>

        <!-- Opciones de navegación del sistema -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a id="link-catalogo" href="#" style="padding: 12px; background-color: #1e3a8a; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; font-size: 13px;">📚 Consultar Catálogo y Solicitar Préstamo</a>
            <a id="link-prestamo" href="#" style="padding: 12px; background-color: #00796b; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; font-size: 13px;">📦 Mis Préstamos Activos y Devoluciones</a>
            <a id="link-historial" href="#" style="padding: 12px; background-color: #2b6cb0; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; font-size: 13px;">📜 Historial de Préstamos</a>
            <a id="link-datos" href="#" style="padding: 12px; background-color: #475569; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; font-size: 13px;">⚙️ Constancias y Carta de No Adeudo</a>
        </div>

        <br>
        <div style="text-align: center; margin-top: 15px;">
            <a href="/" style="font-weight: bold; color: #d90429; text-decoration: none; font-size: 12px;">Cerrar Sesión / Salir</a>
        </div>
    </div>

    <script>
        // Extracción de parámetros de sesión enviados por la URL (boleta, nombre y adeudo)
        const params = new URLSearchParams(window.location.search);
        const boleta = params.get('boleta') || '';
        const nombre = params.get('nombre') || 'Alumno';
        const adeudo = params.get('adeudo') || 'Sin adeudos registrados.';

        if (!boleta) {
            alert('Sesión no detectada. Redirigiendo al login...');
            window.location.href = '/';
        }

        // Inyección dinámica de la información del alumno en la interfaz
        document.getElementById('info-usuario').innerText = `Bienvenido(a): ${nombre} — Boleta: ${boleta}`;
        document.getElementById('card-adeudo').innerText = `Estatus: ${adeudo}`;

        // Asignación de parámetros de sesión a los enlaces internos del menú
        document.getElementById('link-catalogo').href = `/catalogo?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;
        document.getElementById('link-prestamo').href = `/prestamo?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;
        document.getElementById('link-historial').href = `/historial?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;
        document.getElementById('link-datos').href = `/datos?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;
    </script>
</body>
</html>
