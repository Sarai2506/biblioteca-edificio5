<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Préstamos, Adeudos y Devolución en Línea</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 700px; text-align: left;">
        <h2>Gestión de Préstamos y Adeudos en Línea</h2>
        <p id="info-alumno" style="margin-bottom: 15px; color: #555;"></p>

        <div style="max-height: 400px; overflow-y: auto;" id="lista-prestamos">
            <p style="text-align: center; color: #777;">Cargando información...</p>
        </div>

        <br>
        <a id="btn-volver" href="#" style="font-weight: bold; color: #1b263b;">← Volver al Menú Principal</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const boleta = params.get('boleta');
        const nombre = params.get('nombre');
        
        document.getElementById('info-alumno').innerText = `Alumno: ${nombre} (Boleta: ${boleta})`;
        document.getElementById('btn-volver').href = `/menu?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;

        async function cargarPrestamos() {
            const res = await fetch(`/api/prestamos/${boleta}`);
            const prestamos = await res.json();

            const contenedor = document.getElementById('lista-prestamos');
            contenedor.innerHTML = '';

            if (prestamos.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #00796b; font-weight: bold;">No tienes préstamos activos ni adeudos pendientes en este momento.</p>';
                return;
            }

            prestamos.forEach(p => {
                const item = document.createElement('div');
                const esRetrasado = p.estatus === 'retrasado';

                item.style.cssText = `padding: 15px; border: 1px solid ${esRetrasado ? '#d90429' : '#cbd5e1'}; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: ${esRetrasado ? '#fff5f5' : '#f8fafc'};`;
                
                let accionesHtml = '';
                if (!esRetrasado) {
                    accionesHtml = `
                        <div style="display: flex; gap: 5px;">
                            <button onclick="renovarPrestamo(${p.id_prestamo})" style="padding: 6px 10px; font-size: 11px; margin: 0; width: auto; background-color: #2b6cb0;">Renovar</button>
                            <button onclick="devolverLibro(${p.id_prestamo}, ${p.id_libro})" style="padding: 6px 10px; font-size: 11px; margin: 0; width: auto; background-color: #00796b;">Devolver</button>
                        </div>
                    `;
                } else {
                    accionesHtml = `
                        <button onclick="devolverLibro(${p.id_prestamo}, ${p.id_libro})" style="padding: 6px 10px; font-size: 11px; margin: 0; width: auto; background-color: #d90429;">Devolver (Castigo)</button>
                    `;
                }

                let colorEstatus = esRetrasado ? '#b7094c' : '#00796b';

                item.innerHTML = `
                    <div>
                        <strong style="font-size: 15px; color: #1b263b;">📖 ${p.titulo}</strong><br>
                        <span style="font-size: 13px; color: #555;">Autor: ${p.autor}</span><br>
                        <span style="font-size: 12px; color: #666;">Fecha límite de entrega: ${p.fecha_devolucion.split('T')[0]}</span><br>
                        <span style="font-size: 12px; font-weight: bold; color: ${colorEstatus};">Estatus: ${p.estatus.toUpperCase()} ${esRetrasado ? '(VENCIDO: Castigo activo tras los 30 días)' : ''}</span>
                    </div>
                    <div>${accionesHtml}</div>
                `;
                contenedor.appendChild(item);
            });
        }

        async function renovarPrestamo(id_prestamo) {
            if (!confirm('¿Deseas extender el préstamo por 30 días adicionales?')) return;

            const response = await fetch('/api/prestamo/renovar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_prestamo })
            });

            const result = await response.json();
            alert(result.message);
            if (result.success) {
                cargarPrestamos();
            }
        }

        async function devolverLibro(id_prestamo, id_libro) {
            if (!confirm('¿Deseas registrar la devolución en línea de este libro?')) return;

            const response = await fetch('/api/prestamo/devolver', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_prestamo, id_libro })
            });

            const result = await response.json();
            alert(result.message);
            if (result.success) {
                cargarPrestamos();
            }
        }

        cargarPrestamos();
    </script>
</body>
</html>
