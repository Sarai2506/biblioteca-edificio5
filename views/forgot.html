<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Biblioteca IPN</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <form action="/forgot" method="POST">
            <h2>Recuperar Contraseña</h2>
            <p style="margin-bottom: 15px; color: #555; font-size: 13px;">Introduce tu boleta y correo institucional para restablecerla.</p>
            <input name="boleta" placeholder="Número de Boleta" required>
            <input name="email" type="email" placeholder="Correo (@alumno.ipn.mx)" required>
            <input name="new_password" type="password" placeholder="Nueva Contraseña" required>
            <button type="submit">Actualizar Contraseña</button>
            <p><a href="/">Volver al Login</a></p>
        </form>
    </div>
</body>
</html>
