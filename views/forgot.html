<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acceso - Biblioteca IPN</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; text-align: center;">
        
        <form action="/forgot" method="POST" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <span class="user-badge" style="background-color: #b45309; color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px;">SOPORTE TÉCNICO</span>
            <h2 style="color: #1b263b; margin-bottom: 5px;">Restablecer Contraseña</h2>
            <p style="margin-bottom: 20px; color: #555; font-size: 13px;">Ingresa tu número de boleta y establece una nueva contraseña de acceso.</p>
            
            <!-- Campo de boleta -->
            <div class="form-group" style="width: 100%; max-width: 320px; margin-bottom: 12px;">
                <input type="text" name="boleta" placeholder="Número de Boleta" required style="width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 12px; text-align: center;">
            </div>

            <!-- Campo de nueva contraseña -->
            <div class="form-group" style="width: 100%; max-width: 320px; margin-bottom: 15px;">
                <input type="password" name="new_password" placeholder="Nueva Contraseña (Mín. 8 caracteres)" required minlength="8" style="width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 12px; text-align: center;">
            </div>

            <!-- Botón de actualización -->
            <button type="submit" class="btn-enviar" style="width: 100%; max-width: 320px; padding: 10px; background-color: #b45309; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Actualizar Contraseña</button>
            
            <p class="footer-link" style="margin-top: 15px; font-size: 12px;">
                <a href="/" style="color: #2b6cb0; text-decoration: none; font-weight: bold;">← Volver al Login</a>
            </p>
        </form>
    </div>
</body>
</html>
