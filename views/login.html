<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Biblioteca ESIME Zacatenco Edificio 5</title>
    <!-- Vinculación con la hoja de estilos global externa -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; text-align: center;">
        
        <form action="/login" method="POST" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <span class="user-badge" style="background-color: #1b263b; color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px;">IPN - ESIME ZACATENCO</span>
            <h2 style="color: #1b263b; margin-bottom: 5px;">Biblioteca Edificio 5</h2>
            <p style="margin-bottom: 20px; color: #555; font-size: 13px;">Ingresa tu número de boleta (Alumnos) o credenciales (Administradores).</p>
            
            <!-- Campo de boleta -->
            <div class="form-group" style="width: 100%; max-width: 320px; margin-bottom: 12px;">
                <input type="text" name="boleta" placeholder="Número de Boleta / Usuario" required style="width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 12px; text-align: center;">
            </div>

            <!-- Campo de contraseña (Opcional para alumnos, obligatorio para administradores) -->
            <div class="form-group" style="width: 100%; max-width: 320px; margin-bottom: 15px;">
                <input type="password" name="password" placeholder="Contraseña (Solo Administradores)" style="width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 12px; text-align: center;">
            </div>

            <!-- Botón de acceso -->
            <button type="submit" class="btn-enviar" style="width: 100%; max-width: 320px; padding: 10px; background-color: #1b263b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Ingresar</button>
            
            <!-- Enlaces de navegación rápida -->
            <div style="margin-top: 15px; font-size: 12px; display: flex; flex-direction: column; gap: 8px;">
                <a href="/register" style="color: #2b6cb0; text-decoration: none; font-weight: bold;">¿No estás registrado? Regístrate aquí</a>
                <a href="/forgot" style="color: #64748b; text-decoration: none;">¿Olvidaste tu contraseña o boleta?</a>
            </div>
        </form>
    </div>
</body>
</html>
