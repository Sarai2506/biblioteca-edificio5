<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Biblioteca IPN</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <form action="/register" method="POST">
            <h2>Registro de Alumno</h2>
            <input name="boleta" placeholder="Boleta (Ej. 2025302430)" required>
            <input name="nombre" placeholder="Nombre completo" required>
            <input name="sexo" placeholder="Sexo (M/F)" required>
            <input name="unidad_de_procedencia" placeholder="Unidad (Ej. ESIME Zacatenco)" required>
            <input name="email" type="email" placeholder="Correo (@alumno.ipn.mx)" required>
            <input name="password" type="password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
            <p><a href="/">Volver al Login</a></p>
        </form>
    </div>
</body>
</html>
