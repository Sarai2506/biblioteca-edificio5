<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Bibliográfico</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 700px; text-align: left;">
        <h2>Catálogo de Libros - Edificio 5</h2>
        <input type="text" id="busqueda" placeholder="Buscar por título, autor o ISBN..." onkeyup="buscarLibros()">
        
        <div style="max-height: 420px; overflow-y: auto; margin-top: 15px;" id="resultados">
            <p style="text-align: center; color: #777;">Escribe para buscar material...</p>
        </div>

        <br>
        <a id="btn-volver" href="#" style="font-weight: bold; color: #1b263b;">← Volver al Menú Principal</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const boleta = params.get('boleta');
        const nombre = params.get('nombre');
        document.getElementById('btn-volver').href = `/menu?boleta=${boleta}&nombre=${encodeURIComponent(nombre)}`;

        async function buscarLibros() {
            const query = document.getElementById('busqueda').value;
            const res = await fetch(`/api/libros?q=${query}`);
            const libros = await res.json();

            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '';

            if (libros.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #777;">No se encontraron libros.</p>';
                return;
            }

            libros.forEach(libro => {
                const item = document.createElement('div');
                item.style.cssText = 'padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; background: #fafafa;';
                
                let seccionPrestamo = '';
                if (libro.disponibles > 0) {
                    seccionPrestamo = `
                        <div style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 11px; color: #555;">Plazo automático: 30 días</span>
                            <button onclick="solicitarPrestamo(${libro.id_libro})" style="padding: 8px 14px; font-size: 13px; margin: 0; width: auto; background-color: #00796b;">Solicitar Préstamo</button>
                        </div>
                    `;
                } else {
                    seccionPrestamo = `<p style="color: red; font-size: 12px; font-weight: bold; margin-top: 8px;">Agotado temporalmente</p>`;
                }

                item.innerHTML = `
                    <div style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;" onclick="toggleDetalles(${libro.id_libro})">
                        <div>
                            <strong style="font-size: 15px; color: #1b263b;">📖 ${libro.titulo}</strong><br>
                            <span style="color: #555; font-size: 13px;">Autor: ${libro.autor} | <em>Haz clic para ver detalles</em></span>
                        </div>
                        <span style="color: #00796b; font-size: 12px; font-weight: bold;">Disponibles: ${libro.disponibles}/${libro.cantidad_total}</span>
                    </div>

                    <div id="detalles-${libro.id_libro}" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 13px; color: #444;">
                        <p><strong>ISBN:</strong> ${libro.isbn || 'No disponible'}</p>
                        <p style="margin: 5px 0;"><strong>Descripción:</strong> ${libro.descripcion || 'Sin descripción detallada.'}</p>
                        ${seccionPrestamo}
                    </div>
                `;
                contenedor.appendChild(item);
            });
        }

        function toggleDetalles(id) {
            const div = document.getElementById(`detalles-${id}`);
            div.style.display = div.style.display === 'none' ? 'block' : 'none';
        }

        async function solicitarPrestamo(id_libro) {
            if (!confirm('¿Deseas solicitar el préstamo de este libro por un periodo de 30 días?')) return;

            const response = await fetch('/api/prestamo/solicitar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ boleta, id_libro })
            });

            const result = await response.json();
            alert(result.message);
            if (result.success) {
                buscarLibros();
            }
        }

        buscarLibros();
    </script>
</body>
</html>
